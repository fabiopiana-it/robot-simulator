<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tildy - Robot Simulator</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1e1b4b;--muted:#6b6a8f;--p:#7c3aed;--c:#06b6d4;--pk:#ec4899;--y:#f59e0b;--ok:#16a34a;--bad:#e11d48;--grid:#ddd6fe;--cell:#faf5ff;--field:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f2e;--card:#221a47;--ink:#f1edff;--muted:#a79fd6;--grid:#3b2f73;--cell:#1b1438;--field:#150f2e;--y:#fbbf24}}
:root[data-theme="dark"]{--bg:#150f2e;--card:#221a47;--ink:#f1edff;--muted:#a79fd6;--grid:#3b2f73;--cell:#1b1438;--field:#150f2e;--y:#fbbf24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(120deg,#7c3aed,#ec4899 60%,#f59e0b);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px}
.sig{margin-left:auto;width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.brand{height:46px;width:auto;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
header svg{width:60px;height:60px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
h1{margin:0;font-size:clamp(20px,4.5vw,34px);letter-spacing:.06em;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.2)}
header p{margin:2px 0 0;font-size:13px;opacity:.95}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 0}
nav button{border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--grid)}
nav button.on{background:var(--p);color:#fff}
main{display:grid;grid-template-columns:minmax(0,680px) minmax(280px,1fr);gap:18px;padding:14px 18px 24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--grid)}
canvas{display:block;border-radius:12px;max-width:100%}
.panel{display:flex;flex-direction:column;gap:12px}
#task{margin:0;line-height:1.45}
textarea{width:100%;height:260px;resize:vertical;border:3px solid var(--grid);border-radius:12px;padding:10px;font:600 17px/1.5 "Consolas","Courier New",monospace;background:var(--field);color:var(--ink)}
textarea:focus,input:focus{outline:none;border-color:var(--p)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.go{background:var(--ok)}.step{background:var(--c)}.rst{background:var(--pk)}.chk{background:var(--p)}
input[type=text]{width:90px;border:3px solid var(--grid);border-radius:10px;padding:8px;font:800 18px inherit;text-transform:uppercase;text-align:center;background:var(--field);color:var(--ink)}
select{border:3px solid var(--grid);border-radius:10px;padding:7px 8px;font:800 16px inherit;background:var(--field);color:var(--ink)}
input[type=range]{accent-color:var(--p);flex:1;min-width:100px}
#msg{border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.4;display:none}
#msg.good{display:block;background:#dcfce7;color:#14532d}
#msg.bad{display:block;background:#ffe4e6;color:#881337}
#msg.info{display:block;background:#e0f2fe;color:#0c4a6e}
#cur{color:var(--muted);font-size:14px;min-height:20px}
.help{font-size:14px;color:var(--muted);line-height:1.6}
.help b{color:var(--p);font-family:monospace;font-size:15px}
</style>
</head>

<nav id="tabs"></nav>
<main>
<div class="card"><canvas id="cv"></canvas></div>
<div class="panel">
<div class="card"><p id="task"></p></div>
<div class="card panel">
<textarea id="ed" spellcheck="false" autocapitalize="characters" aria-label="Programma"></textarea>
<div class="row"><button class="btn go" id="run">▶ Esegui</button><button class="btn step" id="stp">⏭ Passo</button><button class="btn rst" id="rst">↺ Reset</button></div>
<div class="row"><label for="spd">🐢</label><input type="range" id="spd" min="1" max="10" value="6"><span>🐇</span></div>
<div class="row" id="startrow" style="display:none"><b>Partenza:</b><label for="sc">Colonna</label><select id="sc"></select><label for="sr">Riga</label><select id="sr"></select><label for="sd">Verso</label><select id="sd"></select></div>
<div class="row" id="ansrow" style="display:none"><label for="ans"><b>Casella finale:</b></label><input type="text" id="ans" maxlength="4" placeholder="es. M7"><button class="btn chk" id="chk">✔ Verifica</button></div>
<div id="cur"></div>
<div id="msg"></div>
</div>
<div class="card help"><b>START</b> inizio · <b>STOP</b> fine · <b>MOVE(n)</b> avanza di n caselle · <b>RIGHT</b> gira a destra di 90° · <b>LEFT</b> gira a sinistra di 90°<br>Una sola istruzione per riga.</div>
</div>
</main>
<script>
const COLS="ABCDEFGHILMNOPQRSTUVZ".split(""),N=21,D=[[0,-1],[1,0],[0,1],[-1,0]],DN=["NORD","EST","SUD","OVEST"];
const $=id=>document.getElementById(id),cell=(x,y)=>COLS[x]+(y+1);
const REF2="START\nMOVE(3)\nLEFT\nMOVE(13)\nLEFT\nMOVE(4)\nRIGHT\nMOVE(1)\nRIGHT\nMOVE(11)\nRIGHT\nMOVE(5)\nLEFT\nMOVE(3)\nSTOP";
const EX1="START\nMOVE(3)\nLEFT\nMOVE(2)\nRIGHT\nMOVE(4)\nLEFT\nMOVE(10)\nLEFT\nMOVE(4)\nLEFT\nMOVE(5)\nRIGHT\nMOVE(7)\nRIGHT\nMOVE(8)\nLEFT\nMOVE(2)\nSTOP";
const LV={
esempio:{n:"Esempio",t:"free",s:{x:2,y:5,d:0},p:"START\nMOVE(2)\nRIGHT\nMOVE(5)\nRIGHT\nMOVE(3)\nSTOP",txt:"Esempio: premi ▶ Esegui e guarda cosa fa il robot. Poi prova a cambiare i numeri!"},
es1:{n:"Esercizio 1",t:"trace",s:{x:7,y:17,d:1},p:EX1,txt:"Il robot parte da H-18 orientato a EST. Segui il programma, scrivi la casella in cui finisce e premi Verifica. Poi premi Esegui per vedere se hai ragione!"},
es2:{n:"Esercizio 2",t:"write",s:{x:2,y:2,d:2},p:"",ref:REF2,txt:"Scrivi il programma che porta il robot lungo il tracciato giallo, da ▼ (C-3, orientato a SUD) fino a ●. Poi premi Esegui."},
libero:{n:"Libero",t:"free",s:{x:9,y:10,d:0},p:"START\n\nSTOP",txt:"Modalità libera: parti da L-11 orientato a NORD e disegna il percorso che vuoi!"}};
const saved={};let curId,L,T,steps=[],k=0,timer=null,ready=false,err=null,W=600;
const cv=$("cv"),ctx=cv.getContext("2d"),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function parse(t){const c=[];t.split("\n").forEach((l,i)=>{const s=l.trim().toUpperCase();if(s)c.push({s,line:i+1})});
if(!c.length||c[0].s!=="START")return{error:"Il programma deve iniziare con START."};
if(c.length<2||c[c.length-1].s!=="STOP")return{error:"Il programma deve finire con STOP."};
const m=c.slice(1,-1);for(const x of m){let r;
if(x.s==="LEFT"||x.s==="RIGHT")x.t=x.s;
else if(r=x.s.match(/^MOVE\s*\(\s*(\d+)\s*\)$/)){x.t="MOVE";x.n=+r[1]}
else if(x.s==="START"||x.s==="STOP")return{error:`Riga ${x.line}: ${x.s} va scritto una sola volta, ${x.s==="START"?"all’inizio":"alla fine"}.`};
else return{error:`Riga ${x.line}: istruzione “${x.s}” non riconosciuta.`}}
return{cmds:m}}

function sim(cmds,s){let x=s.x,y=s.y,d=s.d;const st=[{x,y,d,i:-1}];let e=null;
for(let i=0;i<cmds.length&&!e;i++){const c=cmds[i];
if(c.t==="MOVE"){for(let j=0;j<c.n;j++){const nx=x+D[d][0],ny=y+D[d][1];
if(nx<0||ny<0||nx>=N||ny>=N){e=`Riga ${c.line}: il robot è uscito dalla griglia!`;break}
x=nx;y=ny;st.push({x,y,d,i})}}
else{d=(d+(c.t==="RIGHT"?1:3))%4;st.push({x,y,d,i})}}
return{steps:st,error:e}}

function load(id){stop();if(L)saved[curId]=$("ed").value;curId=id;L=LV[id];T=null;
if(L.ref){const r=sim(parse(L.ref).cmds,L.s).steps;T={steps:r,end:r[r.length-1],vis:new Set(r.map(a=>a.x+","+a.y))}}
$("ed").value=saved[id]!==undefined?saved[id]:L.p;$("task").textContent=L.txt;updTask();$("ansrow").style.display=L.t==="trace"?"flex":"none";$("ans").value="";
$("startrow").style.display=id==="libero"?"flex":"none";if(id==="libero"){$("sc").value=L.s.x;$("sr").value=L.s.y;$("sd").value=L.s.d}
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
reset()}
function updTask(){if(L===LV.libero)$("task").textContent=`Modalità libera: parti da ${COLS[L.s.x]}-${L.s.y+1} orientato a ${DN[L.s.d]} e disegna il percorso che vuoi!`}
function reset(){stop();ready=false;steps=[];k=0;say("");$("cur").textContent="";draw(null)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function say(t,c){const m=$("msg");m.className=c||"";m.textContent=t}

function prep(){const p=parse($("ed").value);if(p.error){say("⚠️ "+p.error,"bad");return false}
const r=sim(p.cmds,L.s);steps=r.steps;err=r.error;cmdsList=p.cmds;k=0;ready=true;say("");draw(0);return true}
let cmdsList=[];
function run(){stop();if(!prep())return;timer=setInterval(tick,1150-$("spd").value*100)}
function tick(){if(k<steps.length-1){k++;draw(k);info()}else finish()}
function info(){const s=steps[k];$("cur").textContent=s.i>=0?"Istruzione: "+cmdsList[s.i].s:""}
function step(){stop();if(!ready||k>=steps.length-1){if(!prep())return}
if(steps.length>1){const i0=steps[k+1].i;do{k++}while(k<steps.length-1&&steps[k+1].i===i0)}
draw(k);info();if(k>=steps.length-1)finish()}
function finish(){stop();const e=steps[k];
if(err){say("💥 "+err,"bad");return}
const where=`Il robot è nella casella ${cell(e.x,e.y)}, orientato a ${DN[e.d]}.`;
if(L.t==="write"){const v=new Set(steps.map(a=>a.x+","+a.y));
const same=v.size===T.vis.size&&[...v].every(a=>T.vis.has(a));const endOk=e.x===T.end.x&&e.y===T.end.y;
if(same&&endOk)say("✅ GIUSTO! Bravissimi, il robot ha percorso tutto il tracciato!","good");
else if(!endOk)say(`❌ SBAGLIATO. Il robot è arrivato in ${cell(e.x,e.y)} ma doveva arrivare in ${cell(T.end.x,T.end.y)}. Riprova!`,"bad");
else say("❌ SBAGLIATO. Arrivi nella casella giusta, ma il percorso non segue il tracciato giallo. Riprova!","bad")}
else say(where,"info")}

function check(){const a=$("ans").value.toUpperCase().replace(/[\s-]/g,"");
const r=sim(parse(L.p).cmds,L.s).steps,e=r[r.length-1],ok=a===cell(e.x,e.y);
if(!a){say("Scrivi la casella, ad esempio M7.","info");return}
say(ok?`✅ GIUSTO! Il robot finisce in ${cell(e.x,e.y)}. Premi Esegui per vederlo!`:"❌ SBAGLIATO. Ricontrolla il percorso passo dopo passo, oppure premi Esegui per vedere dove arriva il robot.",ok?"good":"bad")}

function size(){const w=Math.max(280,Math.min($("cv").parentElement.clientWidth-28,680)),r=window.devicePixelRatio||1;
W=w;cv.style.width=cv.style.height=w+"px";cv.width=cv.height=Math.round(w*r);ctx.setTransform(r,0,0,r,0,0);draw(ready?k:null)}
function draw(kk){const c=W/22,P=(x,y)=>[(x+1.5)*c,(y+1.5)*c];
ctx.clearRect(0,0,W,W);ctx.fillStyle=css("--card");ctx.fillRect(0,0,W,W);
ctx.fillStyle=css("--cell");ctx.fillRect(c,c,c*N,c*N);
ctx.strokeStyle=css("--grid");ctx.lineWidth=1;ctx.beginPath();
for(let i=0;i<=N;i++){ctx.moveTo(c,c*(i+1));ctx.lineTo(c*(N+1),c*(i+1));ctx.moveTo(c*(i+1),c);ctx.lineTo(c*(i+1),c*(N+1))}ctx.stroke();
ctx.fillStyle=css("--p");ctx.font=`800 ${c*.5}px "Trebuchet MS",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
for(let i=0;i<N;i++){const[a]=P(i,0),[,b]=P(0,i);ctx.fillText(COLS[i],a,c*.5);ctx.fillText(i+1,c*.5,b)}
const path=(st,n)=>{ctx.beginPath();for(let i=0;i<=n;i++){const[x,y]=P(st[i].x,st[i].y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()};
ctx.lineCap=ctx.lineJoin="round";
if(T){ctx.strokeStyle=css("--y");ctx.globalAlpha=.55;ctx.lineWidth=c*.4;ctx.setLineDash([c*.5,c*.35]);path(T.steps,T.steps.length-1);ctx.setLineDash([]);ctx.globalAlpha=1;
const[ex,ey]=P(T.end.x,T.end.y);ctx.fillStyle=css("--pk");ctx.beginPath();ctx.arc(ex,ey,c*.34,0,7);ctx.fill()}
const s0=L.s,[sx,sy]=P(s0.x,s0.y);arrow(sx,sy,s0.d,c*.36,css("--grid"),true);
if(kk!==null&&steps.length){ctx.strokeStyle=css("--c");ctx.lineWidth=c*.3;path(steps,kk);const s=steps[kk],[x,y]=P(s.x,s.y);arrow(x,y,s.d,c*.42,css("--p"),false)}
else arrow(sx,sy,s0.d,c*.42,css("--p"),false)}
function arrow(x,y,d,r,col,ghost){ctx.save();ctx.translate(x,y);ctx.rotate(d*Math.PI/2);ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.85,r*.8);ctx.lineTo(0,r*.4);ctx.lineTo(-r*.85,r*.8);ctx.closePath();ctx.fillStyle=col;ctx.fill();
if(!ghost){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()}ctx.restore()}

Object.entries(LV).forEach(([id,l])=>{const b=document.createElement("button");b.textContent=l.n;b.dataset.id=id;b.onclick=()=>load(id);$("tabs").appendChild(b)});
COLS.forEach((c,i)=>$("sc").add(new Option(c,i)));for(let i=0;i<N;i++)$("sr").add(new Option(i+1,i));DN.forEach((n,i)=>$("sd").add(new Option(n,i)));
["sc","sr","sd"].forEach(id=>$(id).onchange=()=>{L.s={x:+$("sc").value,y:+$("sr").value,d:+$("sd").value};updTask();reset()});
$("run").onclick=run;$("stp").onclick=step;$("rst").onclick=reset;$("chk").onclick=check;
$("ed").addEventListener("input",()=>{if(ready||steps.length)reset()});
addEventListener("resize",size);
load("esempio");size();
</script>
